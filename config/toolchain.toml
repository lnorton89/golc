# Deno IS an application runtime dependency, unlike Node above (which is
# contributor-only tooling for the isolated tools/linear-sync workspace):
# the packaged Windows build ships and supervises a pinned Deno executable
# (WIN-02) as the process-isolated, zero-permission TypeScript automation
# sandbox SCRP-03 rests on. Windows is the only qualified v1 platform
# (STATE.md, Phase 10 constraint); the four non-Windows records make
# contributor bootstrap available cross-platform without qualifying or
# supporting the GOLC application on Linux or macOS, mirroring Go/Mage's
# existing pattern above. Every archive_sha256 below is the official
