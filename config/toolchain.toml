# midicat is a Go-ecosystem CLI helper the gomidi/midicatdrv MIDI driver
# (gitlab.com/gomidi/midi/v2, a go.mod dependency) shells out to at
# runtime, never a build toolchain in its own right. It has no per-
# platform release archive to checksum-pin like go/mage/node above, so it
# is provisioned via `go install <module>@<version>` using the
# already-pinned Go toolchain -- Go's own module proxy/sumdb verifies
# module integrity. See internal/bootstrap/engine.go's
# installGoInstallTools for the install step and
# internal/midi/driver.go's doc comment for why cmd/golc-desktop needs
# this binary present merely to start, not just to use MIDI hardware.
[go_install.midicat]
version = "v1.0.7"
module = "gitlab.com/gomidi/tools/midicat"

# wails is the Wails v2 CLI, needed only for `mage RunDev`'s hot-reload dev
# loop (`wails dev`) -- never for a plain `mage Build`/`mage Run`, which
# compile cmd/golc-desktop directly with `go build -tags desktop,production`
# and never shell out to this binary. Installed the same way as midicat:
# `go install <module>@<version>` using the already-pinned Go toolchain,
# best-effort/non-fatal per installGoInstallTools (internal/bootstrap/
# engine.go). Version/module here must stay in sync with
# internal/bootstrap/cache.go's WailsVersion/WailsModule constants, which
# reserved this exact GoBin path (WailsBinaryPath) before this pin existed;
# TestScopeBootstrapCache's toolchain-drift test in bootstrap_test.go
# enforces the two never disagree.
[go_install.wails]
version = "v2.13.0"
module = "github.com/wailsapp/wails/v2/cmd/wails"

# golangci-lint is contributor-facing static analysis tooling (`mage
# Lint`), never a build/test dependency of the application itself.
# Installed the same way as midicat/wails: `go install
# <module>@<version>` using the already-pinned Go toolchain, best-effort/
# non-fatal per installGoInstallTools (internal/bootstrap/engine.go). Its
# root package is github.com/golangci/golangci-lint/v2 (the module), but
# `go install` names the produced binary after cmd/golangci-lint's own
# last path element -- "golangci-lint", with the internal hyphen
# validToolName (engine.go) was extended to allow -- so this table's own
# key must be "golangci-lint" too (installGoInstallTools looks the
# binary up at GoBin/ExecutableName(name), i.e. it requires the go_install
# key to equal the binary's actual basename, exactly like midicat/wails
# above).
[go_install.golangci-lint]
version = "v2.12.2"
module = "github.com/golangci/golangci-lint/v2/cmd/golangci-lint"

[cache]
downloads = ".tools/cache/downloads"
gomodcache = ".tools/cache/go-mod"
gocache = ".tools/cache/go-build"
