# Contributor-tool portability observation only. Linux and macOS results do
# not qualify the GOLC application for either platform.
#
# Go and Mage are both installed from the checksum-pinned archives
# committed in config/toolchain.toml (scripts/ci/install-pinned-mage.
# {sh,ps1}), not via an ambient `go install`: that approach is absent an
# ambient Go entirely on some hosted macOS runners, and even where it
# succeeds its GOPATH/bin output is not on PATH for later steps by
# default. Go is provisioned alongside Mage (not just Mage) because Mage
# JIT-compiles the magefile package at every invocation and therefore
# always needs a Go compiler on PATH, regardless of how the mage binary
# itself was obtained.
#
# libx11-dev and xvfb are a deliberate, narrow exception to the
# checksum-pinned tooling philosophy above: golang.design/x/hotkey's
# Linux backend (internal/wails/hotkey.go's OS-level safety-cluster
# shortcuts) cgo-links against X11/Xlib.h at build time, which
# ubuntu-latest does not install by default, and its package init()
# additionally connects to a real X11 DISPLAY at process startup --
# ubuntu-latest has no display server at all, so any test binary that
# imports the package (internal/wails's own tests) panics immediately
# without a virtual framebuffer. Both are system packages, not project
# archive pins -- apt's own package integrity is the trust boundary
# here, the same way it already is for the ambient ubuntu-latest/
# macos-latest Go used to install Mage.
#
# The three steps that actually cgo-link Wails' Linux frontend
# (CheckOffline, Build, Test) run through shell.nix on Linux instead of
# apt: ubuntu-latest's current image has dropped the webkit2gtk-4.0
# package entirely (superseded by webkit2gtk-4.1, which Wails v2 does
# not support -- see README.md's "Desktop app: the webkit2gtk-4.0
# problem"), so there is no apt package left to install that would fix
# `pkg-config: Package gtk+-3.0/webkit2gtk-4.0 was not found` (observed
# live: run 30499787505). shell.nix already solves this for local
# contributor use on Nix/NixOS by overlaying webkitgtk_4_0 from a
# pinned pre-removal nixpkgs release (nixos-25.05) inside a
# buildFHSEnv; this reuses that exact same file rather than duplicating
# the pin, so CI and a contributor's `nix-shell` never drift apart.
# NIX_PATH is set explicitly (not left to the installer's default
# channel setup, which needs `nix-channel --update` to have ever run) so
# `<nixpkgs>` resolves deterministically -- to nixpkgs-unstable, NOT the
# same nixos-25.05 shell.nix's overlay pins webkitgtk_4_0/libsoup_2_4
# from: shell.nix's targetPkgs list also depends on go_1_26 from the
# BASE <nixpkgs> (unrelated to the overlay), which nixos-25.05 predates
# entirely (observed live: run 30502664783, "error: undefined variable
# 'go_1_26' at shell.nix:25:5" once NIX_PATH was pinned to nixos-25.05).
# buildFHSEnv's sandbox is built with bubblewrap (bwrap), which needs an
# unprivileged user namespace to set up its uid/gid mapping -- current
# ubuntu-latest images ship an AppArmor profile that blocks unprivileged
# userns creation by default (a security hardening default, not a Nix
# issue), so bwrap fails closed with "setting up uid map: Permission
# denied" unless that restriction is lifted first (observed live: run
# 30503477786). GenerateCheck and PackageFoundation do not link the
# darwin/linux frontend at all (see build.go/package.go) and stay on
# the native runner directly.
name: cross-platform Mage observation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    env:
      GOLC_BOOTSTRAP_INCLUDE_LINEAR_SYNC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install X11 development headers (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev xvfb

      - name: Start virtual X11 display (Linux only)
        if: runner.os == 'Linux'
        run: Xvfb :99 -screen 0 1024x768x24 & echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Install Nix (Linux only)
        if: runner.os == 'Linux'
        run: sh <(curl -L https://nixos.org/nix/install) --no-daemon && echo "NIX_PATH=nixpkgs=https://github.com/NixOS/nixpkgs/archive/nixpkgs-unstable.tar.gz" >> "$GITHUB_ENV"

      - name: Allow unprivileged user namespaces for bubblewrap (Linux only)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install pinned Mage (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/ci/install-pinned-mage.sh

      - name: Install pinned Mage (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/install-pinned-mage.ps1

      - name: Bootstrap verified project toolchains
        run: mage Bootstrap

      - name: Check generated files
        run: mage GenerateCheck

      - name: Check offline graph (Linux, via pinned Nix webkit2gtk-4.0)
        if: runner.os == 'Linux'
        run: . "$HOME/.nix-profile/etc/profile.d/nix.sh" && nix-shell shell.nix --run "mage CheckOffline"

      - name: Check offline graph
        if: runner.os != 'Linux'
        run: mage CheckOffline

      - name: Build (Linux, via pinned Nix webkit2gtk-4.0)
        if: runner.os == 'Linux'
        run: . "$HOME/.nix-profile/etc/profile.d/nix.sh" && nix-shell shell.nix --run "mage Build"

      - name: Build
        if: runner.os != 'Linux'
        run: mage Build

      - name: Test (Linux, via pinned Nix webkit2gtk-4.0)
        if: runner.os == 'Linux'
        run: . "$HOME/.nix-profile/etc/profile.d/nix.sh" && nix-shell shell.nix --run "mage Test"

      - name: Test
        if: runner.os != 'Linux'
        run: mage Test

      - name: Package foundation
        run: mage PackageFoundation
