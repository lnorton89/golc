# GOLC non-blocking code-quality observation workflow (lint + known-
# vulnerability scanning + AsyncAPI contract validation).
#
# internal/command/lint.go's own doc comment states golangci-lint is
# deliberately excluded from the offline core graph and the required
# commands.pr.steps graph: .golangci.yml's header notes this repository
# has never run a linter before, so the enabled ruleset stays advisory --
# surfaced here, not gating -- until it has been battle-tested across
# real PRs. govulncheck (internal/command/vulncheck.go) follows the same
# policy for the same reason: it is new tooling, and a pre-existing
# finding in an already-pinned dependency should surface for review
# rather than instantly block every open PR. The job-level
# `continue-on-error: true` mirrors cross-platform-mage.yml's own
# non-blocking observation pattern; each step below additionally sets its
# own `continue-on-error: true` so one failing step never prevents a later
# one from also running and reporting.
#
# The "asyncapi" step validates docs/api/asyncapi.yaml (including its
# cross-file $ref into docs/api/openapi.json) via tools/asyncapi-validate,
# an isolated pinned @asyncapi/cli workspace -- mirroring design-system.yml's
# own pattern of resolving the pinned Node toolchain directly for an
# npm-ecosystem CI check, rather than routing through the Go command
# registry the way lint/govulncheck do (this is an npm tool operating on a
# docs artifact, not a Go-ecosystem CLI). Unlike lint/govulncheck's own
# offline-safe binaries, `npm ci` here reaches the npm registry.
#
# This file deliberately never touches check.yml's strict command-parity
# contract: internal/command/check.go's "check --command-parity" route
# only ever reads prWorkflowPath (.github/workflows/check.yml), so adding
# or changing this workflow can never affect that check.
#
# Mage itself is provisioned from the checksum-pinned archive committed in
# config/toolchain.toml (scripts/ci/install-pinned-mage.ps1), the same
# script check.yml and design-system.yml both use. No repository secret is
# read, exported, or referenced anywhere in this file, and the only
# trigger is an untrusted pull_request event. Unlike the offline core
# graph, govulncheck reaches the network to fetch the public vulnerability
# database (https://vuln.go.dev) -- consistent with this workflow running
# entirely outside RunOffline's deny-transport contract.
name: quality

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Mage
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci/install-pinned-mage.ps1

      - name: bootstrap
        run: mage Bootstrap

      - name: lint
        continue-on-error: true
        run: mage Lint

      - name: govulncheck
        continue-on-error: true
        run: mage Govulncheck

      - name: asyncapi
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $toolchain = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE "config\toolchain.toml")
          $match = [regex]::Match($toolchain, '(?ms)^\[toolchain\.node\]\r?\nversion\s*=\s*"([^"]+)"')
          if (-not $match.Success) {
            throw "GOLC_QUALITY_NODE_MISSING: config/toolchain.toml does not pin toolchain.node.version"
          }
          $nodeVersion = $match.Groups[1].Value
          $nodeDir = Join-Path $env:GITHUB_WORKSPACE ".tools\toolchains\node\$nodeVersion\windows-amd64\node-v$nodeVersion-win-x64"
          if (-not (Test-Path -LiteralPath (Join-Path $nodeDir "node.exe") -PathType Leaf)) {
            throw "GOLC_QUALITY_NODE_MISSING: run mage Bootstrap first"
          }
          $env:PATH = "$nodeDir;$env:PATH"
          Push-Location (Join-Path $env:GITHUB_WORKSPACE "tools\asyncapi-validate")
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "GOLC_QUALITY_ASYNCAPI_INSTALL_FAILED: npm ci exited $LASTEXITCODE" }
            npm run validate
            if ($LASTEXITCODE -ne 0) { throw "GOLC_QUALITY_ASYNCAPI_INVALID: npm run validate exited $LASTEXITCODE" }
          } finally {
            Pop-Location
          }
